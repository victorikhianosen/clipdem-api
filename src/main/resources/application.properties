spring.application.name=MovieDownloader

spring.datasource.url=jdbc:mysql://localhost:3306/movie-downloader
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

downloader.yt-dlp-path=/opt/homebrew/bin/yt-dlp
downloader.ffmpeg-path=/opt/homebrew/bin/ffmpeg
downloader.storage-dir=${java.io.tmpdir}/movie-downloader
downloader.inspect-timeout-seconds=30
downloader.download-timeout-seconds=1800
downloader.max-file-size-bytes=5368709120
downloader.max-concurrent-downloads=3
downloader.file-retention-hours=24

# Shared secret trusted server-side callers (e.g. the Next.js app's route handlers) must send
# in the X-API-Key header. Override via the API_SECURITY_API_KEY env var in real deployments.
api-security.api-key=${API_SECURITY_API_KEY:df43aab815252aae751d02ffbf4f2a5d9096d08847b2bd13aae0332834fe0e03}

